[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-reasoning"
version = "0.0.0"  # stamped from .claude-plugin/plugin.json by CI
description = "Perfect memory. Exact reasoning. Complete history. Bi-temporal graph memory for AI coding agents."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Aditya Mukhopadhyay", email = "webmaster@adityamukho.com"}
]
keywords = ["ai-agents", "graph-database", "datalog", "knowledge-graph", "persistent-memory", "temporal-reasoning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Floor is a correctness requirement, not a preference. Before the
    # project-minigraf/minigraf#304 fix, FileLock::acquire treated a lock held
    # by our own PID as stale and opened anyway, so a second handle on one file
    # was created silently. Two handles each cache their own page_count and
    # corrupt each other -- the flaky "Page N out of bounds" of #251/#253.
    # mcp_server reaches that state through normal operation, so an older
    # minigraf here means silent graph corruption under concurrent load.
    # The core fix shipped in 1.2.2; 1.2.3 is the release this is verified
    # against (1.2.2's Node binding was withdrawn for an unrelated gap).
    # Capped below 2.0: minigraf 2.0.0 deleted the .graph.lock PID sidecar,
    # moving the lock into the kernel via File::try_lock on the .graph file
    # itself (project-minigraf/minigraf#317). With the bound open, CI resolved
    # 2.0.0 and four tests that assert the sidecar's existence failed on master
    # -- TestGetDbLockRetry (x2), TestDbLeaseManager and
    # TestSingleHandlePerProcess. The single-handle invariant itself SURVIVES
    # (flock/OFD locks attach to the open file description, so #304's
    # same-process denial still holds); it is the sidecar the tests reach for
    # that is gone. 2.0.0 also changes every error string (a "[CODE] " prefix)
    # and adds a ~375ms internal retry before reporting a cross-process
    # conflict, which absorbs attempts that used to reach _DbLeaseManager's
    # own retry loop. Taking that upgrade is its own change -- raise the cap
    # as part of it, not before it. See #284.
    "minigraf>=1.2.3,<2.0.0",
    # Capped below 2.0: mcp 2.0.0 removed Server.list_tools, which
    # mcp_server.py registers its handlers through. With the bound open, CI
    # resolved 2.0.0 and every test that imports mcp_server errored at import
    # (902 of them). Migrating to the 2.x handler API is its own change --
    # raise the cap as part of that, not before it.
    "mcp>=1.27.0,<2.0.0",
]

[project.scripts]
temporal-reasoning = "mcp_server:run"

[project.optional-dependencies]
git-ingestion = [
    "tree-sitter>=0.22.0",
    "tree-sitter-rust", "tree-sitter-python", "tree-sitter-javascript",
    "tree-sitter-typescript", "tree-sitter-go", "tree-sitter-java",
    "tree-sitter-c", "tree-sitter-cpp",
    "tree-sitter-c-sharp", "tree-sitter-ruby", "tree-sitter-php",
    "tree-sitter-kotlin", "tree-sitter-swift", "tree-sitter-scala",
    "tree-sitter-haskell", "tree-sitter-lua", "tree-sitter-elixir",
]
llm = ["anthropic>=0.40.0"]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.23.0",
    "black>=25.11.0",
    "ruff>=0.15.12",
]

[tool.setuptools]
py-modules = ["mcp_server", "report_issue", "fact_index"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pylint.messages_control]
max-line-length = 100
disable = ["C0111", "C0301", "C0303", "C0411", "C0413", "C0415", "R0801", "W0212", "W0611", "W0621"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

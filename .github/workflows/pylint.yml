name: Lint

on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # ruff is a standalone binary: it parses with its own Rust front end and
    # never imports the code under the host interpreter. So this job said
    # nothing about Python compatibility -- it used to run the identical check
    # under a 3.8/3.9/3.10 matrix, two rows of which `requires-python` already
    # excludes, and all three of which end in `|| echo` and cannot fail (#331).
    # One row, and the interpreter version is whatever setup-python defaults to.
    - name: Set up Python
      uses: actions/setup-python@v5
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff
    - name: Analysing the code with ruff
      run: |
        ruff check $(git ls-files '*.py') || echo "Lint warnings (non-blocking)"
